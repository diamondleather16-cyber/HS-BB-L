name: Audit source CSV duplicates 2025 2026
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/dedupe_2025_2026_source_csv.py
      - .github/workflows/dedupe_2025_2026_source_csv.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove only provably exact repeated rows from source CSV files
        run: python scripts/dedupe_2025_2026_source_csv.py --apply
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: source-csv-duplicate-audit
          path: |
            master/duplicate_source_2025_2026_report.json
            master/duplicate_source_2025_2026_candidates.csv
          retention-days: 30
      - name: Publish deduplicated CSV sources and audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data master/duplicate_source_2025_2026_report.json master/duplicate_source_2025_2026_candidates.csv
          if git diff --cached --quiet; then echo "No exact duplicates"; exit 0; fi
          git commit -m "Remove exact duplicate 2025-2026 source CSV records with audit"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
