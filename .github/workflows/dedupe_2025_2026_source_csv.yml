name: Audit source CSV duplicates 2025 2026
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/dedupe_2025_2026_source_csv.py
      - .github/workflows/dedupe_2025_2026_source_csv.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify residual duplicates after exact-only CSV cleanup
        run: python scripts/dedupe_2025_2026_source_csv.py
      - name: Measure duplicate suppression in actual generated ledger
        run: |
          python scripts/merge.py
          python - <<'PY'
          import csv,collections
          c=collections.Counter()
          with open("output/all_matches.csv",encoding="utf-8-sig",newline="") as f:
            for r in csv.DictReader(f):
              if r.get("year") in ("2025","2026"):
                c["ledger_2025_2026"]+=1
                if r.get("_source_file")=="data/all_matches.csv":
                  c["legacy_2025_2026_remaining"]+=1
          print("MERGED_LEDGER_AUDIT",dict(c))
          PY
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: source-csv-duplicate-audit
          path: |
            master/duplicate_source_2025_2026_report.json
            master/duplicate_source_2025_2026_candidates.csv
            master/duplicate_source_2025_2026_score_conflicts.csv
          retention-days: 30
