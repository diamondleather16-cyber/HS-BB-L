name: Audit school master links and tournament geography
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_ledger_school_identity.py'
      - '.github/workflows/audit_ledger_school_identity.yml'
permissions:
  contents: write
concurrency:
  group: school-identity-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and audit
        run: |
          python -m py_compile scripts/audit_ledger_school_identity.py
          python scripts/audit_ledger_school_identity.py
      - name: Publish audit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add docs/data/ledger_school_identity_audit.csv docs/data/ledger_school_identity_audit_summary.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish school identity and geography audit"
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit_ledger_school_identity.py
            sleep 2
          done
          exit 1
