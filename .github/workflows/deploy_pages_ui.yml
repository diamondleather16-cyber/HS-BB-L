name: Deploy Pages UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy_pages_ui.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify current UI assets
        run: |
          echo "Latest commit:"
          git log -1 --oneline
          test -s docs/index.html

          APP="$(grep -oE 'app-[A-Za-z0-9._-]+\.js' docs/index.html | tail -1)"
          CSS="$(grep -oE 'styles-[A-Za-z0-9._-]+\.css' docs/index.html | tail -1)"

          echo "Current app:  $APP"
          echo "Current css:  $CSS"

          test -n "$APP"
          test -n "$CSS"
          test -s "docs/$APP"
          test -s "docs/$CSS"

          echo "Build tags:"
          grep -Eo 'UI-[A-Z0-9-]+' "docs/$APP" | tail -3 || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
