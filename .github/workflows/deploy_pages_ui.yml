name: Deploy Pages UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy_pages_ui.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ui
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify UI build tag
        run: |
          echo "Latest commit:"
          git log -1 --oneline
          echo "UI references:"
          grep -n "history-id-redesign-v2" docs/index.html || true
          grep -n "UI-HISTORY-ID-REDESIGN-V2" docs/index.html docs/app-history-id-redesign-v2.js || true
          test -s docs/index.html
          test -s docs/app-history-id-redesign-v2.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
