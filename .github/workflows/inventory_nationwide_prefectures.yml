name: Inventory 2021-26 prefectural gaps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/inventory_nationwide_prefectures.py'
      - '.github/workflows/inventory_nationwide_prefectures.yml'
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create nationwide existing-source gap matrix
        run: python scripts/inventory_nationwide_prefectures.py
      - name: Publish inventory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master/nationwide_2021_2026_inventory.csv master/nationwide_2021_2026_inventory_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish nationwide 2021-26 prefecture coverage inventory"
          git pull --rebase origin main
          git push origin HEAD:main
