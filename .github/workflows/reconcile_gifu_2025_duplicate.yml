name: Reconcile Gifu duplicate safely
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/reconcile_gifu_2025_duplicate.py'
      - '.github/workflows/reconcile_gifu_2025_duplicate.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check duplicates and reconcile exactly one legacy row
        run: python scripts/reconcile_gifu_2025_duplicate.py
      - name: Commit verified correction only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data master/import_fixes/gifu_2025_spring_duplicate_reconciliation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deduplicate Gifu 2025 spring semifinal with provenance"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
