name: Audit Hokushinetsu autumn prediction accuracy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_hokushinetsu_prediction_v1.py'
      - '.github/workflows/audit_hokushinetsu_prediction_v1.yml'
permissions:
  contents: write
concurrency:
  group: hokushinetsu-prediction-audit-v1
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify syntax
        run: python -m py_compile scripts/audit_hokushinetsu_prediction_v1.py
      - name: Generate read-only autumn prediction audit
        run: python scripts/audit_hokushinetsu_prediction_v1.py
      - name: Commit only the diagnostic outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/audit/hokushinetsu_prediction_v1.json docs/data/audit/hokushinetsu_prediction_games_v1.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Hokushinetsu autumn prediction calibration report"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
