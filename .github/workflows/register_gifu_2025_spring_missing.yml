name: Register verified missing Gifu semifinal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/register_gifu_2025_spring_missing.py'
      - '.github/workflows/register_gifu_2025_spring_missing.yml'
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parsing dependencies
        run: pip install -q requests beautifulsoup4
      - name: Validate source and insert no more than one match
        run: python scripts/register_gifu_2025_spring_missing.py
      - name: Record only verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imported/2025/spring/岐阜.csv master/import_fixes/gifu_2025_spring_walkoff.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Register missing Gifu 2025 spring walk-off semifinal"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
