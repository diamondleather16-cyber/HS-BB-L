name: Historical tournament completeness audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_historical_completeness_2021_2024.py'
      - '.github/workflows/audit_historical_completeness_2021_2024.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_historical_completeness_2021_2024.py
      - name: Save completeness report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master/historical_completeness_2021_2024.csv master/historical_completeness_summary_2021_2024.json
          git diff --cached --quiet && exit 0
          git commit -m "Audit historical tournament completeness indicators"
          git pull --rebase origin main
          git push origin HEAD:main
