name: Verify undated historical games from dated scoreboards
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/bulk_verify_historical_dates.py'
      - '.github/workflows/bulk_verify_historical_dates.yml'
permissions:
  contents: write
concurrency:
  group: historical-date-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install requests beautifulsoup4
      - name: Validate source and run score-verified date completion
        run: |
          python -m py_compile scripts/bulk_verify_historical_dates.py
          python scripts/bulk_verify_historical_dates.py
      - name: Verify only blank dates changed
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          src=Path("output/audit/bulk_verified_dates.csv")
          with src.open(encoding="utf-8-sig",newline="") as f:
              rows=list(csv.DictReader(f))
          for r in rows:
              assert r["date"].startswith(r["year"]+"-")
              assert r["source_url"].startswith("https://zutto-sports.com/")
          print("VERIFIED",len(rows))
          PY
      - name: Commit checked dates on current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/historical_ledger_2017_2024.csv output/audit/bulk_verified_dates.csv output/audit/bulk_verified_dates.json
          if git diff --cached --quiet; then
            echo "::notice::No verifiable dates found"
            exit 0
          fi
          git commit -m "Fill historical dates confirmed by matching external scoreboards"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "::notice::Published dated historical games"
                exit 0
              fi
            else
              echo "::error::Conflicting concurrent historical ledger update. Will not overwrite newer data."
              exit 1
            fi
            sleep 3
          done
          exit 1
