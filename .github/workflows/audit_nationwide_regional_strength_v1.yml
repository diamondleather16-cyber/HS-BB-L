name: Audit nationwide regional strengths and prefecture forecast effects
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_nationwide_regional_strength_v1.py'
      - '.github/workflows/audit_nationwide_regional_strength_v1.yml'
permissions:
  contents: write
concurrency:
  group: nationwide-regional-strength-diagnostic
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and execute regional diagnostic
        run: |
          python -m py_compile scripts/audit_nationwide_regional_strength_v1.py
          python scripts/audit_nationwide_regional_strength_v1.py
      - name: Publish audit output only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/audit/nationwide_regional_strength_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish nationwide regional-strength forecast diagnostic"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
