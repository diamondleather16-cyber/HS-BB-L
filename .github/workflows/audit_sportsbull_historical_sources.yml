name: Audit supplied Sportsbull historical pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_sportsbull_historical_sources.py'
      - 'master/verified_regional_2017_2024_new_sources.json'
      - '.github/workflows/audit_sportsbull_historical_sources.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/audit_sportsbull_historical_sources.py
      - name: Save URL access audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/audit/sportsbull_historical_sources.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish verification status for thirteen historical Sportsbull pages"
          git pull --rebase origin main
          git push origin HEAD:main
