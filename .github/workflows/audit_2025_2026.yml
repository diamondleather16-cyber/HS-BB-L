name: Audit 2025-26 prefecture records
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit_2025_2026.yml'
      - 'scripts/audit_2025_2026.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit_2025_2026.py
      - name: Commit audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master/audit_2025_2026_units.csv master/audit_2025_2026_issues.csv master/audit_2025_2026_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish 2025-26 integrity audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
