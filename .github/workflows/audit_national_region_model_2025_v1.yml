name: Audit national regional offsets against 2025 outcomes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_national_region_model_2025_v1.py'
      - '.github/workflows/audit_national_region_model_2025_v1.yml'
permissions:
  contents: write
concurrency:
  group: audit-national-region-model-2025
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and compare national regional models
        run: |
          python -m py_compile scripts/audit_national_region_model_2025_v1.py
          python scripts/audit_national_region_model_2025_v1.py
      - name: Publish read-only national diagnostic
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/audit/national_region_model_2025_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish 2025 national interregional model diagnostic"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
