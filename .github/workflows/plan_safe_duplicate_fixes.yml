name: Nationwide duplicate plan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/plan_safe_duplicate_fixes.py'
      - '.github/workflows/plan_safe_duplicate_fixes.yml'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/plan_safe_duplicate_fixes.py
      - uses: actions/upload-artifact@v4
        with:
          name: nationwide-plan
          path: output/audit/bulk_exact_duplicate_plan.json
