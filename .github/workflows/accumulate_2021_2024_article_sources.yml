name: Historical article evidence
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/accumulate_2021_2024_article_sources.py'
      - '.github/workflows/accumulate_2021_2024_article_sources.yml'
      - 'scripts/parse_archived_historical_articles.py'
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/accumulate_2021_2024_article_sources.py
      - run: python scripts/parse_archived_historical_articles.py
      - name: Publish staging CSV without changing canonical ledger
        run: |
          set -euo pipefail
          mkdir -p master/staging_2021_2024
          cp master/raw_article_intake_2021_2024/staged_matches.csv master/staging_2021_2024/staged_matches.csv
          cp master/raw_article_intake_2021_2024/staging_report.json master/staging_2021_2024/staging_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master/staging_2021_2024
          if ! git diff --cached --quiet; then
            git commit -m "Store 2021-24 raw match staging separately from rating ledger"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: historic-source-inventory
          path: master/raw_article_intake_2021_2024/
