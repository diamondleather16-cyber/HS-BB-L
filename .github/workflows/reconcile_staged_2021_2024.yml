name: Reconcile historical 2021-24 staging
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/reconcile_staged_2021_2024.py'
      - '.github/workflows/reconcile_staged_2021_2024.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/reconcile_staged_2021_2024.py
      - name: Save reconciliation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master/staging_2021_2024/reconciliation_summary.json master/staging_2021_2024/reconciliation_by_unit.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit staged 2021-24 games against all historical source data"
          git pull --rebase origin main
          git push origin HEAD:main
