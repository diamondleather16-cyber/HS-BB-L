name: Build Rating Events v2 & Deploy

on:
  workflow_dispatch:
  # Coalesce frequent source imports into a periodic build. A manual request
  # remains available for immediate calculation.
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'master/rating_rebuild_request.json'
      - 'master/level_overrides.csv'
      - 'scripts/apply_match_edits.py'
      - 'scripts/validate_split_id_ratings.py'
      - 'scripts/build_rating_events_v2.py'
      - 'scripts/normalize_local_stages.py'
      - 'scripts/build_prefecture_model.py'
      - 'scripts/merge.py'
      - 'scripts/audit_restored_coverage.py'
      - 'scripts/build_ledger_shards.py'
      - 'scripts/dedupe_ledger_physical_fixtures.py'
      - 'scripts/guard_published_tournaments.py'
      - 'scripts/check_physical_dedupe_regressions.py'
      - 'scripts/validate_rating_oct10_regression.py'
      - 'scripts/reconcile_ledger_registry.py'
      - 'data/all_matches.csv'
      - 'docs/data/historical_ledger_2017_2024.csv'
      - 'data/imported/**'
      - 'data/date_sources/**'
      - 'scripts/apply_2018_autumn_verified_dates.py'
      - 'scripts/apply_2019_verified_dates.py'
      - 'scripts/validate_full_replay_coverage.py'
      - 'scripts/reconcile_historical_match_dates.py'
      - '.github/workflows/build_rating_events_v2.yml'

permissions:
  contents: write

concurrency:
  group: rating-events-v2
  # A button-initiated build takes precedence over older automatic builds.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python syntax before rebuilding
        run: |
          python -m py_compile scripts/normalize_local_stages.py scripts/apply_2018_autumn_verified_dates.py scripts/apply_2019_verified_dates.py scripts/sync_verified_historical_dates.py scripts/audit_rating_history_discrepancies.py scripts/apply_shared_school_master.py scripts/purge_blank_tournament_rows.py scripts/merge.py scripts/dedupe_ledger_physical_fixtures.py scripts/reconcile_historical_match_dates.py scripts/apply_match_edits.py scripts/build_match_delete_index.py scripts/build_prefecture_model.py scripts/build_rating_events_v2.py scripts/validate_historical_school_replay_v64.py scripts/validate_current_ratings.py scripts/validate_split_id_ratings.py scripts/validate_rating_pipeline_v61.py scripts/build_ledger_shards.py scripts/validate_full_replay_coverage.py

      - name: Regression test for physical-game duplicate suppression
        run: python scripts/check_physical_dedupe_regressions.py

      - name: Rebuild authoritative ledger and ratings
        run: |
          echo "::notice::START python scripts/apply_shared_school_master.py $(date -u +%FT%TZ)"
          python scripts/apply_shared_school_master.py
          echo "::notice::DONE python scripts/apply_shared_school_master.py $(date -u +%FT%TZ)"
          echo "::notice::START python scripts/purge_blank_tournament_rows.py $(date -u +%FT%TZ)"
          python scripts/purge_blank_tournament_rows.py
          echo "::notice::DONE python scripts/purge_blank_tournament_rows.py $(date -u +%FT%TZ)"
          echo "::notice::START python scripts/merge.py $(date -u +%FT%TZ)"
          python scripts/merge.py
          python scripts/reconcile_ledger_registry.py
          echo "::notice::DONE python scripts/merge.py $(date -u +%FT%TZ)"
          echo "::notice::START historical date reconciliation $(date -u +%FT%TZ)"
          python scripts/reconcile_historical_match_dates.py
          echo "::notice::DONE historical date reconciliation $(date -u +%FT%TZ)"
          echo "::notice::START python scripts/apply_match_edits.py $(date -u +%FT%TZ)"
          python scripts/apply_match_edits.py
          echo "::notice::DONE python scripts/apply_match_edits.py $(date -u +%FT%TZ)"
          python scripts/sync_verified_historical_dates.py
          python scripts/apply_2018_autumn_verified_dates.py
          python -m pip install --quiet beautifulsoup4
          python scripts/apply_2019_verified_dates.py
          echo "::notice::START python scripts/build_match_delete_index.py $(date -u +%FT%TZ)"
          python scripts/dedupe_ledger_physical_fixtures.py
          python scripts/build_match_delete_index.py
          echo "::notice::DONE python scripts/build_match_delete_index.py $(date -u +%FT%TZ)"
          echo "::notice::START python scripts/build_prefecture_model.py $(date -u +%FT%TZ)"
          python scripts/build_prefecture_model.py
          echo "::notice::DONE python scripts/build_prefecture_model.py $(date -u +%FT%TZ)"
          echo "::notice::START python scripts/build_rating_events_v2.py $(date -u +%FT%TZ)"
          /usr/bin/time -p python scripts/build_rating_events_v2.py
          echo "::notice::DONE python scripts/build_rating_events_v2.py $(date -u +%FT%TZ)"
          python scripts/validate_full_replay_coverage.py
          echo "::notice::START python scripts/validate_historical_school_replay_v64.py $(date -u +%FT%TZ)"
          python scripts/validate_historical_school_replay_v64.py
          echo "::notice::DONE python scripts/validate_historical_school_replay_v64.py $(date -u +%FT%TZ)"
          echo "::notice::START python scripts/validate_current_ratings.py $(date -u +%FT%TZ)"
          python scripts/validate_current_ratings.py
          echo "::notice::DONE python scripts/validate_current_ratings.py $(date -u +%FT%TZ)"
          echo "::notice::START python scripts/validate_split_id_ratings.py $(date -u +%FT%TZ)"
          python scripts/validate_split_id_ratings.py
          echo "::notice::DONE python scripts/validate_split_id_ratings.py $(date -u +%FT%TZ)"
          echo "::notice::START python scripts/validate_rating_pipeline_v61.py $(date -u +%FT%TZ)"
          python scripts/validate_rating_pipeline_v61.py
          echo "::notice::DONE python scripts/validate_rating_pipeline_v61.py $(date -u +%FT%TZ)"

      # A completed run must never silently publish a rating history that has
      # dropped the authoritative 2026 Hokushinetsu first round.
      - name: Block publication if any Hokushinetsu first-round rating is missing
        run: python scripts/validate_rating_oct10_regression.py

      - name: Audit rating history against the authoritative ledger
        run: python scripts/audit_rating_history_discrepancies.py

      - name: Prepare Pages data
        run: |
          mkdir -p docs/data
          python - <<'PY'
          import json,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          status={
            "input_revision":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "calculated_at":datetime.now(timezone.utc).isoformat(),
            "status":"calculated_snapshot",
          }
          Path("docs/data/publication_status.json").write_text(json.dumps(status,ensure_ascii=False,indent=2)+chr(10),encoding="utf-8")
          PY
          cp output/all_matches.csv docs/data/all_matches.csv
          /usr/bin/time -p python scripts/build_ledger_shards.py
          python scripts/guard_published_tournaments.py
          rm -rf docs/data/ledger_shards
          cp -r output/ledger_shards docs/data/ledger_shards
          cp output/current_ratings.csv docs/data/current_ratings.csv
          cp output/rating_events.csv docs/data/rating_events.csv
          cp output/rating_school_events.csv docs/data/rating_school_events.csv
          cp output/audit/rating_history_discrepancies.csv docs/data/rating_history_discrepancies.csv
          cp output/audit/rating_history_discrepancies.json docs/data/rating_history_discrepancies.json
          cp output/audit/full_replay_coverage_2008_2026.json docs/data/full_replay_coverage_2008_2026.json
          cp output/audit/full_replay_missing_fixtures.csv docs/data/full_replay_missing_fixtures.csv
          cp output/audit/ledger_registry_reconciliation.json docs/data/ledger_registry_reconciliation.json

          rm -rf docs/data/school_history
          if [ -d output/school_history ]; then cp -r output/school_history docs/data/school_history; fi
          if [ -f output/school_rating_history_coverage.csv ]; then cp output/school_rating_history_coverage.csv docs/data/school_rating_history_coverage.csv; fi
          if [ -f output/rating_audit_summary.json ]; then cp output/rating_audit_summary.json docs/data/rating_audit_summary.json; fi
          if [ -f output/audit/historical_date_reconciliation.json ]; then cp output/audit/historical_date_reconciliation.json docs/data/historical_date_reconciliation.json; fi
          if [ -f output/rating_pipeline_audit.csv ]; then cp output/rating_pipeline_audit.csv docs/data/rating_pipeline_audit.csv; fi
          if [ -f output/prefecture_ratings.csv ]; then cp output/prefecture_ratings.csv docs/data/prefecture_ratings.csv; fi
          if [ -f output/prefecture_rating_events.csv ]; then cp output/prefecture_rating_events.csv docs/data/prefecture_rating_events.csv; fi
          if [ -f output/prefecture_history_coverage.csv ]; then cp output/prefecture_history_coverage.csv docs/data/prefecture_history_coverage.csv; fi
          if [ -f master/prefecture_strength_prior.csv ]; then cp master/prefecture_strength_prior.csv docs/data/prefecture_strength_prior.csv; fi
          if [ -f master/prefecture_matchups.csv ]; then cp master/prefecture_matchups.csv docs/data/prefecture_matchups.csv; fi
          if [ -f master/school_master_shared.json ]; then cp master/school_master_shared.json docs/data/school_master_shared.json; fi
          if [ -f master/match_edits_shared.json ]; then cp master/match_edits_shared.json docs/data/match_edits_shared.json; fi
          if [ -f master/match_delete_index.json ]; then cp master/match_delete_index.json docs/data/match_delete_index.json; fi

          test -s docs/data/current_ratings.csv
          test -s docs/data/rating_audit_summary.json
          test -s docs/data/ledger_shards/manifest.json

      - name: Audit all required tournaments, historical fixture retention, and suspected duplicates
        run: python scripts/audit_restored_coverage.py

      # Keep a verifiable recovery checkpoint even if publishing to main fails.
      # An artifact does not change the public ranking; it preserves calculated data.
      - name: Record calculation input revision
        run: |
          mkdir -p output
          git rev-parse HEAD > output/rating_input_revision.txt
          date -u +%FT%TZ > output/rating_checkpoint_utc.txt

      - name: Save calculated results for recovery
        uses: actions/upload-artifact@v4
        with:
          name: rating-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            docs/data/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish generated outputs without rebasing conflicting ledgers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          INPUT_REV="$(git rev-parse HEAD)"

          stage_generated() {
            git add -A -- output docs/data
            for f in docs/data/audit/coverage_summary.json docs/data/audit/expected_tournaments.csv docs/data/audit/suspected_duplicates.csv docs/data/audit/missing_historical_source_fixtures.csv docs/data/audit/source_file_regressions.csv; do
              if [ -f "$f" ]; then git add -f -- "$f"; fi
            done
          }

          stage_generated
          if git diff --cached --quiet; then
            echo "::notice::No generated changes."
            exit 0
          fi
          git commit -m "Rebuild authoritative ledger and ratings"
          SNAPSHOT="$(git rev-parse HEAD)"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! python scripts/check_rating_source_changes.py "$INPUT_REV" origin/main; then
              echo "::warning::Source data changed during calculation; rebuilding on latest main."
              git reset --hard origin/main
              INPUT_REV="$(git rev-parse HEAD)"
              bash scripts/rebuild_rating_pipeline_for_retry.sh
              # The retry script rebuilds ratings but not this new audit.
              # Always regenerate the audit against that same exact snapshot.
              python scripts/audit_restored_coverage.py
              stage_generated
              if git diff --cached --quiet; then
                echo "::notice::Latest calculation is already published."
                exit 0
              fi
              git commit -m "Rebuild authoritative ledger and ratings after source update"
              SNAPSHOT="$(git rev-parse HEAD)"
              continue
            fi
            git reset --hard origin/main
            git restore --source="$SNAPSHOT" --staged --worktree -- output docs/data
            stage_generated
            if git diff --cached --quiet; then
              echo "::notice::The exact generated snapshot is already published."
              exit 0
            fi
            git commit -m "Publish calculated rating snapshot from $INPUT_REV"
            if git push origin HEAD:main; then
              echo "::notice::Published generated outputs (attempt $attempt)."
              exit 0
            fi
            echo "::warning::main advanced; retrying publication (attempt $attempt)."
            sleep 2
          done
          echo "::error::Publication exhausted five attempts."
          exit 1
