name: Audit nationwide all CSV coverage 2021-26
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_all_prefecture_data_2021_2026.py'
      - '.github/workflows/audit_all_prefecture_data_2021_2026.yml'
      - 'scripts/bulk_publish_staged_2021_2024.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_all_prefecture_data_2021_2026.py
      - name: Save full nationwide CSV coverage results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master/nationwide_all_data_coverage_2021_2026.csv master/nationwide_all_data_coverage_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "Record nationwide prefectural coverage across all source CSVs"
          git pull --rebase origin main
          git push origin HEAD:main
