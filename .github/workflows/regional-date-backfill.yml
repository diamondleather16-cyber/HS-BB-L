name: Recover verified regional match dates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/regional-date-backfill.yml'
permissions:
  contents: write
concurrency:
  group: historical-regional-date-recovery
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install beautifulsoup4
      - name: Recover exact verified game dates
        run: python scripts/backfill_verified_regional_dates.py
      - name: Request chronological rating rebuild when data changes
        run: |
          python - <<'PY'
          import json, os, pathlib
          report=json.loads(pathlib.Path('output/audit/regional_date_backfill.json').read_text())
          if report['filled']:
              p=pathlib.Path('master/rating_rebuild_request.json')
              p.write_text(json.dumps({
                  'requested_from':'automatic-verified-regional-dates',
                  'nonce':'regional-'+os.environ['GITHUB_RUN_ID'],
                  'filled':report['filled']
              },ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit verified dates and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/historical_ledger_2017_2024.csv output/audit/regional_date_backfill.json master/rating_rebuild_request.json
          if git diff --cached --quiet; then
            echo "No new verified dates or audit changes"
            exit 0
          fi
          git commit -m "Backfill source-verified regional dates and publish audit"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
