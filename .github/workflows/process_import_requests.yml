name: Tournament Import Fast Path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - master/import_requests.json
      - scripts/process_import_requests.py
      - .github/workflows/process_import_requests.yml

permissions:
  contents: write

concurrency:
  group: tournament-import-fast
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install importer dependencies
        run: |
          echo "Installing importer dependencies (no setup-python pip cache)"
          python -m pip install --disable-pip-version-check -q requests beautifulsoup4

      - name: Detect latest request action
        id: req
        shell: bash
        run: |
          ACTION="$(python -c 'import json; from pathlib import Path; d=json.loads(Path("master/import_requests.json").read_text(encoding="utf-8-sig")); r=(d.get("requests") or [{}])[-1]; a=str(r.get("action") or "analyze"); print(a if a in {"analyze","approve"} else "analyze")')"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Latest request action: $ACTION"

      - name: Analyze URL only
        if: steps.req.outputs.action == 'analyze'
        run: python scripts/process_import_requests.py --mode analyze

      - name: Register approved CSV only
        if: steps.req.outputs.action == 'approve'
        run: python scripts/process_import_requests.py --mode approve

      - name: Commit fast-path result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master/import_audit.json data/imported master/match_edits_shared.json || true
          if git diff --cached --quiet; then
            echo "No fast-path changes."
            exit 0
          fi
          git commit -m "Process tournament import fast path"
          for TRY in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced; refreshing latest main (try $TRY)..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
