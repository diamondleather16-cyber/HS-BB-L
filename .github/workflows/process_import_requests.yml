name: Tournament Import Fast Path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - master/import_queue/**
      - master/import_requests.json
      - scripts/process_import_requests.py
      - .github/workflows/process_import_requests.yml

permissions:
  contents: write

concurrency:
  group: tournament-import-fast
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4

      - name: Process all unhandled import requests
        run: python scripts/process_import_requests.py --mode auto

      - name: Refresh ledger data immediately after registration
        shell: bash
        run: |
          set -e
          if git status --short data/imported | grep . >/dev/null; then
            echo "Imported tournament data changed; rebuilding ledger snapshot."
            python scripts/merge.py
            python scripts/apply_match_edits.py
            mkdir -p docs/data
            cp output/all_matches.csv docs/data/all_matches.csv
          else
            echo "Analyze-only request; ledger rebuild not needed."
          fi

      - name: Commit fast-path result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage_results () {
            git add master/import_audit.json docs/data/import_audit.json data/imported master/match_edits_shared.json output/all_matches.csv docs/data/all_matches.csv || true
          }

          stage_results
          if git diff --cached --quiet; then
            echo "No tournament import result to commit."
            exit 0
          fi

          git commit -m "Process tournament import fast path"

          if git push origin HEAD:main; then
            exit 0
          fi

          for TRY in 1 2 3; do
            echo "Push raced; rebuilding on latest main (try $TRY)..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            python scripts/process_import_requests.py --mode auto

            if git status --short data/imported | grep . >/dev/null; then
              python scripts/merge.py
              python scripts/apply_match_edits.py
              mkdir -p docs/data
              cp output/all_matches.csv docs/data/all_matches.csv
            fi

            stage_results
            if git diff --cached --quiet; then
              echo "Another run already committed this request."
              exit 0
            fi

            git commit -m "Process tournament import fast path"
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Could not publish tournament import result after 3 clean retries."
          exit 1
