name: Process Tournament Import Requests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - master/import_requests.json
      - scripts/process_import_requests.py
      - .github/workflows/process_import_requests.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tournament-import
  cancel-in-progress: false

jobs:
  process:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install importer dependencies
        run: pip install requests beautifulsoup4

      - name: Process requests
        run: python scripts/process_import_requests.py

      - name: Detect approved data changes
        id: imported
        run: |
          if git status --short data/imported | grep . >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild ratings immediately after approved import
        if: steps.imported.outputs.changed == 'true'
        run: |
          python scripts/apply_shared_school_master.py
          python scripts/merge.py
          python scripts/apply_match_edits.py
          python scripts/build_historical_matchups.py
          python scripts/build_rating_events_v2.py
          python scripts/validate_current_ratings.py

          mkdir -p docs/data
          cp output/all_matches.csv docs/data/all_matches.csv
          cp output/current_ratings.csv docs/data/current_ratings.csv
          cp output/rating_events.csv docs/data/rating_events.csv
          cp output/rating_school_events.csv docs/data/rating_school_events.csv
          if [ -f master/school_master_shared.json ]; then
            cp master/school_master_shared.json docs/data/school_master_shared.json
          fi
          if [ -f master/match_edits_shared.json ]; then
            cp master/match_edits_shared.json docs/data/match_edits_shared.json
          fi

      - name: Commit import analysis or approved data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master/import_audit.json docs/data/import_audit.json data/imported || true
          if git diff --cached --quiet; then
            echo "No import changes."
            exit 0
          fi
          git commit -m "Process tournament import request"
          if ! git push origin HEAD:main; then
            echo "Push raced with another update; regenerate once on latest main."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            python scripts/process_import_requests.py

            if git status --short data/imported | grep . >/dev/null; then
              python scripts/apply_shared_school_master.py
              python scripts/merge.py
              python scripts/apply_match_edits.py
              python scripts/build_historical_matchups.py
              python scripts/build_rating_events_v2.py
              python scripts/validate_current_ratings.py

              mkdir -p docs/data
              cp output/all_matches.csv docs/data/all_matches.csv
              cp output/current_ratings.csv docs/data/current_ratings.csv
              cp output/rating_events.csv docs/data/rating_events.csv
              cp output/rating_school_events.csv docs/data/rating_school_events.csv
              if [ -f master/school_master_shared.json ]; then
                cp master/school_master_shared.json docs/data/school_master_shared.json
              fi
              if [ -f master/match_edits_shared.json ]; then
                cp master/match_edits_shared.json docs/data/match_edits_shared.json
              fi
            fi

            git add master/import_audit.json docs/data/import_audit.json data/imported output docs/data || true
            if git diff --cached --quiet; then
              echo "No import changes after refresh."
            else
              git commit -m "Process tournament import request"
              git push origin HEAD:main
            fi
          fi


      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
