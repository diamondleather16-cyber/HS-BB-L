name: Nationwide 2025 autumn prefecture batch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nationwide_prefecture_batch.py'
      - '.github/workflows/nationwide_prefecture_batch.yml'
permissions:
  contents: write
concurrency:
  group: nationwide-prefecture-batch
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests beautifulsoup4
      - name: Batch import 47 prefectures from trusted source manifest
        run: python scripts/nationwide_prefecture_batch.py --year 2025 --season autumn
      - name: Commit imported matches once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imported master/nationwide_prefecture_ingest_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Batch gap-fill 2025 autumn prefectural games nationwide"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
