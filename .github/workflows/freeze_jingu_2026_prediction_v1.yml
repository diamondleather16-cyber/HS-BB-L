name: Freeze 2026 Jingu pre-tournament forecast
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/freeze_jingu_2026_prediction_v1.py'
      - '.github/workflows/freeze_jingu_2026_prediction_v1.yml'
permissions:
  contents: write
concurrency:
  group: freeze-jingu-2026-forecast
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and create prediction before games
        run: |
          python -m py_compile scripts/freeze_jingu_2026_prediction_v1.py
          python scripts/freeze_jingu_2026_prediction_v1.py
      - name: Commit frozen result only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/audit/jingu_2026_prediction_frozen_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish frozen 2026 Meiji Jingu forecasts before tournament"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
