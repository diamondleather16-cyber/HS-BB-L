name: Validate baseball data

on:
  push:
    paths:
      - 'data/**'
      - 'master/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'data/**'
      - 'master/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate CSV data
        run: python scripts/validate.py
