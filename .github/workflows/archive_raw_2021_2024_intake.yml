name: Archive all raw 2021-24 source evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/archive_raw_2021_2024_intake.py'
      - '.github/workflows/archive_raw_2021_2024_intake.yml'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pack every historical source row without changing canonical data
        run: python scripts/archive_raw_2021_2024_intake.py
      - name: Retain source-provenance archive for bulk future normalization
        uses: actions/upload-artifact@v4
        with:
          name: raw-prefecture-2021-2024-${{ github.run_id }}
          path: output/intake_2021_2024/
          retention-days: 90
