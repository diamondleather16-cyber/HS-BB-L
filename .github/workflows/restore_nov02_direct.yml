name: Restore actual missing Nov 2 fixtures
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore_nov02_direct.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-nov02-direct
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare actual published year ledgers and restore absent fixtures
        run: python scripts/restore_nov02_direct.py
      - name: Publish missing fixtures and audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recovered/nov02_true_missing.csv master/nov02_direct_ledger_recovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore vanished Nov 2 fixture rows into source ledger"
          git restore --worktree .
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Keep direct comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-ledger-diff-${{ github.run_id }}
          path: master/nov02_direct_ledger_recovery.json
