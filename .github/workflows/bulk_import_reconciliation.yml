name: Bulk prefecture reconciliation audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/bulk_import_reconciliation.py'
      - '.github/workflows/bulk_import_reconciliation.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests beautifulsoup4
      - name: Run full imported dataset reconciliation
        run: python scripts/bulk_import_reconciliation.py
      - name: Save full review dataset
        uses: actions/upload-artifact@v4
        with:
          name: all-prefecture-reconciliation-${{ github.run_id }}
          path: output/audit/bulk_import_reconciliation.json
          retention-days: 90
