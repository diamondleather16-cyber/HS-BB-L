name: Audit historical ten prefectures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_10pref_2021_2026.py'
      - 'docs/data/ledger_shards/manifest.json'
      - '.github/workflows/audit_10pref_2021_2026.yml'

permissions:
  contents: write

concurrency:
  group: audit-ten-prefectures
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit source and public ledgers
        run: python scripts/audit_10pref_2021_2026.py
      - name: Publish auditable gap report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master/backfill_10pref_2021_2026_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish historical ten-prefecture missing-unit and integrity audit"
          for i in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
