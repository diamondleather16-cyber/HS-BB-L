name: Discover nationwide 2021-26 source articles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_nationwide_prefecture_sources.py'
      - '.github/workflows/discover_nationwide_prefecture_sources.yml'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests beautifulsoup4
      - run: python scripts/discover_nationwide_prefecture_sources.py
      - name: Publish source candidate inventory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master/nationwide_discovered_articles_2021_2026.csv master/nationwide_discovery_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Inventory nationwide historical prefecture article candidates"
          git pull --rebase origin main
          git push origin HEAD:main
