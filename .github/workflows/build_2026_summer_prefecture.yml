name: Build 2026 Summer Prefecture Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect 2026 summer prefecture hierarchy
        run: python scripts/fetch_2026_summer.py

      - name: Validate 2026 summer prefecture hierarchy
        run: python scripts/validate_2026_summer.py

      - name: Merge
        run: python scripts/merge.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi

          git commit -m "Auto-build 2026 summer prefecture data"
          git pull --rebase origin main
          git push
