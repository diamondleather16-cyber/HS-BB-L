name: Backfill historical prefecture games
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill_historical_manual.yml'
      - 'scripts/build_dashboard_ratings.py'
      - 'scripts/backfill_missing_2021_2024.py'
  workflow_dispatch:
    inputs:
      year:
        description: Year to collect
        required: true
        type: choice
        options:
          - '2022'
          - '2023'
          - '2024'
          - '2021'
      apply:
        description: Save newly collected game files
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Collect tournaments
        env:
          YEAR: ${{ inputs.year }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            for y in 2021 2022 2023 2024; do
              python scripts/backfill_missing_2021_2024.py --year "$y" --apply | tee -a backfill.log
            done
          elif [ "$APPLY" = "true" ]; then
            python scripts/backfill_missing_2021_2024.py --year "$YEAR" --apply | tee backfill.log
          else
            python scripts/backfill_missing_2021_2024.py --year "$YEAR" | tee backfill.log
          fi
          python scripts/audit_historical_completeness_2021_2024.py | tee -a backfill.log
          python scripts/build_dashboard_ratings.py | tee -a backfill.log
      - name: Store output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-log
          path: backfill.log
      - name: Commit newly collected games
        if: ${{ inputs.apply || github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imported/ data/all_matches.csv data/current_ratings.csv master/historical_completeness_2021_2024.csv master/historical_completeness_summary_2021_2024.json master/rating_build_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Import historical prefecture games"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
