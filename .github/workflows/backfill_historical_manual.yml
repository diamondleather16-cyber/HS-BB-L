name: Backfill historical prefecture games
on:
  workflow_dispatch:
    inputs:
      year:
        description: Year to collect
        required: true
        type: choice
        options:
          - '2022'
          - '2023'
          - '2024'
          - '2021'
      apply:
        description: Save newly collected game files
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Collect tournaments
        env:
          YEAR: ${{ inputs.year }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            python scripts/backfill_missing_2021_2024.py --year "$YEAR" --apply | tee backfill.log
          else
            python scripts/backfill_missing_2021_2024.py --year "$YEAR" | tee backfill.log
          fi
      - name: Store output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-log
          path: backfill.log
      - name: Commit newly collected games
        if: ${{ inputs.apply }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imported/
          git diff --cached --quiet || (git commit -m "Import historical prefecture games" && git push)
