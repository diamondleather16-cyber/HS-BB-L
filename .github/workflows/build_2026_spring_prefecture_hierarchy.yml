name: Build 2026 Spring Prefecture Hierarchy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect 2026 spring prefecture hierarchy
        run: python scripts/fetch_2026_spring_prefecture_hierarchy.py

      - name: Validate hierarchy
        run: python scripts/validate_2026_spring_prefecture_hierarchy.py

      - name: Merge
        run: python scripts/merge.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data master output
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build 2026 spring prefecture hierarchy"
            git pull --rebase origin main
            git push
          fi
