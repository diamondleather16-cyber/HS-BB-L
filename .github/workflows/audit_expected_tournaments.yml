name: Audit expected tournaments 2008-2026
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit_expected_tournaments.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tournament-completeness-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_expected_tournament_units.py
      - name: Commit inventory report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add master/expected_tournament_inventory_2008_2026.csv master/expected_tournament_inventory_summary.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish all-tournament presence audit vs Nov 2"
          git restore --worktree .
          git pull --rebase origin main
          git push origin HEAD:main
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tournament-inventory-${{ github.run_id }}
          path: |
            master/expected_tournament_inventory_2008_2026.csv
            master/expected_tournament_inventory_summary.json
