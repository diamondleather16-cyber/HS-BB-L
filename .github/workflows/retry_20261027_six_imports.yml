name: Retry six 2026 autumn tournament imports
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry_20261027_six_imports.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: retry-20261027-six
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4
      - name: Import six specifically requested pages
        env:
          HSBB_IMPORT_ONLY_PREFIX: user-20261027-0954-
        run: |
          python scripts/process_import_requests.py --mode auto
          python - <<'PY'
          import json
          from pathlib import Path
          ids=["3916","3914","3913","3887","3911","3915"]
          a=json.loads(Path("master/import_audit.json").read_text(encoding="utf-8-sig"))
          entries={str(x.get("request_id")):x for x in a.get("items",[])}
          failures=[]
          for x in ids:
              k="user-20261027-0954-"+x
              o=entries.get(k,{})
              print("IMPORT_RESULT",x,"status=",o.get("status","MISSING"),
                    "added=",o.get("added_matches",0),
                    "failed=",o.get("failed_targets",0),
                    "warnings=",str(o.get("warnings",[]))[:700],flush=True)
              if o.get("status") not in ("completed","partial"):failures.append(x)
          Path("output").mkdir(exist_ok=True)
          Path("output/six_import_failures.txt").write_text(",".join(failures),encoding="utf-8")
          PY
      - name: Publish imported matches and audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/imported master/import_audit.json master/import_audit_live.json docs/data/import_audit.json docs/data/import_audit_live.json master/match_edits_shared.json
          if ! git diff --cached --quiet; then
            git commit -m "Import six requested 2026 autumn tournament results"
            for i in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              if [ "$i" -eq 3 ]; then exit 1; fi
              git fetch origin main
              git rebase origin/main
            done
          fi
      - name: Verify result after publishing successful partial imports
        run: |
          if [ -s output/six_import_failures.txt ]; then
            echo "::error::One or more pages failed: $(cat output/six_import_failures.txt). Successful pages have been published; see import audit warnings."
            exit 1
          fi
